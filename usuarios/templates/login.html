<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cathedra — Ingresar</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
    }

    .brand {
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #e5e5e5;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 0;
      font-size: 14px;
      color: #999;
      cursor: pointer;
      margin-bottom: -1px;
      transition: all 0.2s;
    }

    .tab.active {
      color: #111;
      font-weight: 500;
      border-bottom-color: #111;
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #111;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      border: none;
      border-bottom: 1px solid #ccc;
      border-radius: 0;
      padding: 6px 0;
      font-size: 14px;
      background: transparent;
      outline: none;
      transition: border-color 0.2s;
      color: #111;
    }

    .field input:focus { border-bottom-color: #111; }

    .field input.invalid { border-bottom-color: #dc2626; }

    .field-error {
      display: none;
      color: #dc2626;
      font-size: 12px;
      margin-top: 5px;
    }

    .field-error.show { display: block; }

    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
    }

    .forgot {
      font-size: 13px;
      color: #111;
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

.btn:hover { background: #333; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      body { padding: 16px; align-items: flex-start; }
      .card { margin-top: 32px; }
    }

    @media (max-width: 480px) {
      .card { padding: 24px 20px; border-radius: 8px; }
      .brand { font-size: 11px; margin-bottom: 20px; }
      .tab { font-size: 13px; }
      .field input { font-size: 16px; }
      .row { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="brand">Cathedra</h1>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login', this)">Sign In</button>
      <button class="tab" onclick="switchTab('register', this)">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="tab-login">
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}
      <form method="post" id="form-login" novalidate>
        {% csrf_token %}
        <div class="field">
          <label for="login-username">Email *</label>
          <input type="text" id="login-username" name="username" required autofocus>
          <span class="field-error" id="err-login-username"></span>
        </div>
        <div class="field">
          <label for="login-password">Password *</label>
          <input type="password" id="login-password" name="password" required>
          <span class="field-error" id="err-login-password"></span>
        </div>
        <div class="row">
          <label class="remember">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>
        <button class="btn" type="submit">Sign In</button>
      </form>
    </div>

    <!-- REGISTER -->
    <div class="form-section" id="tab-register">
      <form method="post" action="{% url 'registro' %}" id="form-register" novalidate>
        {% csrf_token %}
        <div class="field">
          <label for="reg-name">Name *</label>
          <input type="text" id="reg-name" name="first_name" required>
          <span class="field-error" id="err-reg-name"></span>
        </div>
        <div class="field">
          <label for="reg-email">Email *</label>
          <input type="email" id="reg-email" name="email" required>
          <span class="field-error" id="err-reg-email"></span>
        </div>
        <div class="field">
          <label for="reg-username">Username *</label>
          <input type="text" id="reg-username" name="username" required>
          <span class="field-error" id="err-reg-username"></span>
        </div>
        <div class="field">
          <label for="reg-password1">Password *</label>
          <input type="password" id="reg-password1" name="password1" required>
          <span class="field-error" id="err-reg-password1"></span>
        </div>
        <div class="field">
          <label for="reg-password2">Confirm Password *</label>
          <input type="password" id="reg-password2" name="password2" required>
          <span class="field-error" id="err-reg-password2"></span>
        </div>
        <button class="btn" type="submit" style="margin-top:8px;">Create Account</button>
      </form>
    </div>
  </main>

  <script>
    function switchTab(tab, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
    }

    // --- Validación de formularios en JS (sin alert) ---

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function showFieldError(input, message) {
      var errorEl = document.getElementById('err-' + input.id);
      input.classList.add('invalid');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function clearFieldError(input) {
      var errorEl = document.getElementById('err-' + input.id);
      input.classList.remove('invalid');
      errorEl.textContent = '';
      errorEl.classList.remove('show');
    }

    function setupLiveClear(inputs) {
      inputs.forEach(function (input) {
        input.addEventListener('input', function () {
          clearFieldError(input);
        });
      });
    }

    // Formulario de LOGIN
    var loginForm = document.getElementById('form-login');
    var loginUsername = document.getElementById('login-username');
    var loginPassword = document.getElementById('login-password');

    loginForm.addEventListener('submit', function (event) {
      var isValid = true;

      if (loginUsername.value.trim() === '') {
        showFieldError(loginUsername, 'El email es obligatorio.');
        isValid = false;
      } else if (!isValidEmail(loginUsername.value.trim())) {
        showFieldError(loginUsername, 'Ingresa un email con formato válido.');
        isValid = false;
      } else {
        clearFieldError(loginUsername);
      }

      if (loginPassword.value === '') {
        showFieldError(loginPassword, 'La contraseña es obligatoria.');
        isValid = false;
      } else {
        clearFieldError(loginPassword);
      }

      if (!isValid) {
        event.preventDefault();
      }
    });

    setupLiveClear([loginUsername, loginPassword]);

    // Formulario de REGISTRO
    var regForm = document.getElementById('form-register');
    var regName = document.getElementById('reg-name');
    var regEmail = document.getElementById('reg-email');
    var regUsername = document.getElementById('reg-username');
    var regPassword1 = document.getElementById('reg-password1');
    var regPassword2 = document.getElementById('reg-password2');

    regForm.addEventListener('submit', function (event) {
      var isValid = true;

      if (regName.value.trim() === '') {
        showFieldError(regName, 'El nombre es obligatorio.');
        isValid = false;
      } else {
        clearFieldError(regName);
      }

      if (regEmail.value.trim() === '') {
        showFieldError(regEmail, 'El email es obligatorio.');
        isValid = false;
      } else if (!isValidEmail(regEmail.value.trim())) {
        showFieldError(regEmail, 'Ingresa un email con formato válido.');
        isValid = false;
      } else {
        clearFieldError(regEmail);
      }

      if (regUsername.value.trim() === '') {
        showFieldError(regUsername, 'El nombre de usuario es obligatorio.');
        isValid = false;
      } else {
        clearFieldError(regUsername);
      }

      if (regPassword1.value === '') {
        showFieldError(regPassword1, 'La contraseña es obligatoria.');
        isValid = false;
      } else if (regPassword1.value.length < 8) {
        showFieldError(regPassword1, 'La contraseña debe tener al menos 8 caracteres.');
        isValid = false;
      } else {
        clearFieldError(regPassword1);
      }

      if (regPassword2.value === '') {
        showFieldError(regPassword2, 'Debes confirmar la contraseña.');
        isValid = false;
      } else if (regPassword2.value !== regPassword1.value) {
        showFieldError(regPassword2, 'Las contraseñas no coinciden.');
        isValid = false;
      } else {
        clearFieldError(regPassword2);
      }

      if (!isValid) {
        event.preventDefault();
      }
    });

    setupLiveClear([regName, regEmail, regUsername, regPassword1, regPassword2]);
  </script>
</body>
</html>
