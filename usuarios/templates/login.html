<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cathedra — Ingresar</title>
  <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}">
</head>
<body>
  <main class="card">
    <h1 class="brand">Cathedra</h1>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login', this)">Sign In</button>
      <button class="tab" onclick="switchTab('register', this)">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="tab-login">
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}
      <form method="post" id="form-login" novalidate>
        {% csrf_token %}
        <div class="field">
          <label for="login-username">Email *</label>
          <input type="text" id="login-username" name="username" required autofocus>
          <span class="field-error" id="err-login-username"></span>
        </div>
        <div class="field">
          <label for="login-password">Password *</label>
          <input type="password" id="login-password" name="password" required>
          <span class="field-error" id="err-login-password"></span>
        </div>
        <div class="row">
          <label class="remember">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>
        <button class="btn" type="submit">Sign In</button>
      </form>
    </div>

    <!-- REGISTER -->
    <div class="form-section" id="tab-register">
      <form method="post" action="{% url 'registro' %}" id="form-register" novalidate>
        {% csrf_token %}
        <div class="field">
          <label for="reg-name">Name *</label>
          <input type="text" id="reg-name" name="first_name" required>
          <span class="field-error" id="err-reg-name"></span>
        </div>
        <div class="field">
          <label for="reg-email">Email *</label>
          <input type="email" id="reg-email" name="email" required>
          <span class="field-error" id="err-reg-email"></span>
        </div>
        <div class="field">
          <label for="reg-username">Username *</label>
          <input type="text" id="reg-username" name="username" required>
          <span class="field-error" id="err-reg-username"></span>
        </div>
        <div class="field">
          <label for="reg-password1">Password *</label>
          <input type="password" id="reg-password1" name="password1" required>
          <span class="field-error" id="err-reg-password1"></span>
        </div>
        <div class="field">
          <label for="reg-password2">Confirm Password *</label>
          <input type="password" id="reg-password2" name="password2" required>
          <span class="field-error" id="err-reg-password2"></span>
        </div>
        <button class="btn" type="submit" style="margin-top:8px;">Create Account</button>
      </form>
    </div>
  </main>

  <script src="{% static 'usuarios/js/login.js' %}"></script>
</body>
</html>
