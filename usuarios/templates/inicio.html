<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cathedra — Becas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'usuarios/css/inicio.css' %}">
</head>
<body>

<header class="top">
  <a href="{% url 'landing' %}" class="brand">Cathedra</a>
  <form class="search" role="search" onsubmit="return false">
    <label><svg class="i" viewBox="0 0 24 24"><path d="M4 8h16v11H4zM9 8V5h6v3"/></svg><input id="q" placeholder="Buscar becas o universidades" autocomplete="off"></label>
    <label><svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><input id="loc" placeholder="Ciudad o país" autocomplete="off"></label>
    <button type="button" aria-label="Buscar"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  </form>
  <div class="user"><span>{{ request.session.usuario_nombre }}</span><a href="{% url 'logout' %}" class="btn-ghost">Cerrar sesión</a></div>
</header>

<section class="filters" aria-label="Filtros">
  <select id="f-sort" aria-label="Ordenar"><option value="new">Ordenar: más recientes</option><option value="dl">Cierre más próximo</option></select>
  <select id="f-lv" data-l="Nivel" aria-label="Nivel"></select>
  <select id="f-pa" data-l="País" aria-label="País"></select>
  <select id="f-cv" data-l="Cobertura" aria-label="Cobertura"></select>
  <select id="f-ty" data-l="Tipo de beca" aria-label="Tipo de beca"></select>
</section>

<main class="board">
  <section class="list" aria-label="Becas disponibles">
    <div class="list-head"><p id="count"></p><button type="button" class="btn-alert" id="alert">Crear alerta</button></div>
    <div id="cards"></div>
  </section>
  <article class="detail" id="detail" aria-live="polite"></article>
</main>

<footer>
  <div class="footer-brand">Cathedra</div>
  <div class="footer-copy">Universidad de San Buenaventura · Bogotá · 2025</div>
</footer>

<script src="{% static 'usuarios/js/inicio.js' %}"></script>
</body>
</html>
